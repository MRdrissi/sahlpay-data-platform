# =========================================================
# SahlPay — Configuration Spark par défaut (US-03)
# Lue automatiquement par chaque SparkSession créée dans Jupyter
# =========================================================

# ---------- Dépendances (Maven Central) ----------
# Téléchargées par le Driver au démarrage de la session, puis envoyées aux Executors
spark.jars.packages  org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7,org.apache.hadoop:hadoop-aws:3.3.4,io.delta:delta-spark_2.12:3.3.2,io.graphframes:graphframes-spark3_2.12:0.9.2
# Dossier de cache Ivy (volume ivy_cache) : l'utilisateur spark de l'image a pour home /nonexistent
spark.jars.ivy  /home/spark/.ivy2

# ---------- MinIO via S3A (SBD-57) ----------
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ---------- Delta Lake (SBD-58) ----------
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog