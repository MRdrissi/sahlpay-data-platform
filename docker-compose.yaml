name: sahlpay-data-platform

services:

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - sahlpay-network

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      #demandons au même processus Kafka d'assurer les deux responsabilités
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sahlpay-network

  spark-master:
    image: ghcr.io/apache/spark-docker/spark:3.5.7-scala2.12-java17-python3-ubuntu
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - sahlpay-network

  spark-worker-1:
    image: ghcr.io/apache/spark-docker/spark:3.5.7-scala2.12-java17-python3-ubuntu

    hostname: spark-worker-1

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-1
      - --cores
      - "2"
      - --memory
      - "2G"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:8081:8081"

    depends_on:
      - spark-master

    networks:
      - sahlpay-network

  spark-worker-2:
    image: ghcr.io/apache/spark-docker/spark:3.5.7-scala2.12-java17-python3-ubuntu

    hostname: spark-worker-2

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-2
      - --cores
      - "2"
      - --memory
      - "2G"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:8082:8081"

    depends_on:
      - spark-master

    networks:
      - sahlpay-network

  jupyter:
    build:
      context: .
      dockerfile: infrastructure/jupyter/Dockerfile

    image: sahlpay-jupyter:spark-3.5.7

    hostname: jupyter
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"

    volumes:
      - ./notebooks:/home/spark/notebooks
      - ./infrastructure/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy_cache:/home/spark/.ivy2

    depends_on:
      - spark-master

    networks:
      - sahlpay-network


networks:
  sahlpay-network:
    driver: bridge


volumes:
  minio_data:
  kafka_data:
  ivy_cache:
  
